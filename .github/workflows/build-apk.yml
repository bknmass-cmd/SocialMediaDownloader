name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build SocialSaver APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build Angular 22 Frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          echo "=== SEARCHING FOR APK FILES ==="
          find . -name "*.apk"
          mkdir -p ../../dist-apk
          find . -name "*.apk" -exec cp {} ../../dist-apk/SocialSaver-debug.apk \;
          ls -la ../../dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialSaver-APK
          path: dist-apk/SocialSaver-debug.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SocialSaver Android APK v1.0.0
          files: dist-apk/SocialSaver-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
