name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build SocialSaver APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build Angular 22 Frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: frontend/android/gradle-build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialSaver-APK
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
